# Builds the self-hosted critique container and pushes it to the GitHub
# Container Registry, so a server can `docker compose pull` instead of
# building: image is ghcr.io/<owner>/<repo> (e.g. your fork's owner/repo).
#
# Tags: `latest` on the default branch, the git tag on version tags, plus a
# short sha tag for every build. Adjust the tag glob if your release tags are
# not v*. First push creates a private package — set it public in the package
# settings if you want anonymous pulls.

name: container

on:
  push:
    branches: [main]
    tags: ["v*", "critique@*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    # arm64 is built under QEMU emulation, so give the job room.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

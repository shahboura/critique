# Builds the self-hosted critique container and pushes it to the GitHub
# Container Registry, so a server can `docker compose pull` instead of
# building: image is ghcr.io/<owner>/<repo> (e.g. your fork's owner/repo).
#
# Multi-arch (linux/amd64 + linux/arm64) on native runners (faster and more
# reliable than QEMU emulation). Each arch builds separately and pushes by
# digest; the merge job assembles the multi-arch manifest. Runners are pinned
# to explicit images (ubuntu-26.04 / ubuntu-26.04-arm) so the floating
# ubuntu-latest migration cannot change the environment silently.
#
# Tags: `latest` on the default branch, the git tag on version tags, plus a
# short sha tag for every build. Adjust the tag glob if your release tags are
# not v* / critique@*. First push creates a private package — set it public in
# the package settings if you want anonymous pulls.

name: container

on:
  push:
    branches: [main]
    tags: ["v*", "critique@*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test the pushed image
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker rm -f smoke 2>/dev/null || true
          docker run -d --name smoke --cap-drop ALL --security-opt no-new-privileges:true \
            -e PUBLIC_URL=http://smoke.test "$image"
          code=""
          for i in $(seq 1 90); do
            code=$(docker exec smoke node -e 'fetch("http://127.0.0.1:8787/",{redirect:"manual"}).then(r=>console.log(r.status)).catch(()=>process.exit(1))' 2>/dev/null || true)
            [ "$code" = "302" ] && break
            sleep 1
          done
          if [ "$code" != "302" ]; then docker logs smoke | tail -30; exit 1; fi
          docker exec -e EXPECT_PUB=http://smoke.test smoke node /app/scripts/selfhost-smoke.mjs
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf "ghcr.io/${{ github.repository }}@sha256:%s " *)
          echo "tags: $tags"
          echo "sources: $sources"
          set +e
          out=$(docker buildx imagetools create $tags $sources 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::imagetools create exit $code | tags=[$tags] | sources=[$sources] | $msg"
            exit 1
          fi

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

# Builds the self-hosted critique container and pushes it to the GitHub
# Container Registry, so a server can `docker compose pull` instead of
# building: image is ghcr.io/<owner>/<repo> (e.g. your fork's owner/repo).
#
# Multi-arch (linux/amd64 + linux/arm64) on native runners (faster and more
# reliable than QEMU emulation). Each arch builds separately and pushes by
# digest; the merge job assembles the multi-arch manifest. Runners are pinned
# to explicit images (ubuntu-26.04 / ubuntu-26.04-arm) so the floating
# ubuntu-latest migration cannot change the environment silently.
#
# Tags: `latest` on the default branch, the git tag on version tags, plus a
# short sha tag for every build. Adjust the tag glob if your release tags are
# not v* / critique@*. First push creates a private package — set it public in
# the package settings if you want anonymous pulls.
#
# Docker Hub is optional: set the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets
# and the merge job also mirrors the tags to docker.io/<username>/critique.

name: container

on:
  push:
    branches: [main]
    tags: ["v*", "critique@*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # `provenance: true` means mode=min and would override the public-repo mode=max default
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test the pushed image
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker rm -f smoke 2>/dev/null || true
          docker run -d --name smoke \
            -e PUBLIC_URL=http://smoke.test "$image"
          code=""
          for i in $(seq 1 90); do
            code=$(docker exec smoke node -e 'fetch("http://127.0.0.1:8787/",{redirect:"manual"}).then(r=>console.log(r.status)).catch(()=>process.exit(1))' 2>/dev/null || true)
            [ "$code" = "302" ] && break
            sleep 1
          done
          if [ "$code" != "302" ]; then docker logs smoke | tail -30; exit 1; fi
          docker exec -e EXPECT_PUB=http://smoke.test smoke node /app/scripts/selfhost-smoke.mjs
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 15
    env:
      # optional Docker Hub mirror: skipped unless both are set (secrets cannot be
      # used in `if:`, so they are exposed here; both actions below are SHA-pinned)
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf "ghcr.io/${{ github.repository }}@sha256:%s " *)
          echo "tags: $tags"
          echo "sources: $sources"
          count=$(ls -1 | wc -l)
          [ "$count" -eq 2 ] || { echo "::error::expected 2 arch digests, found $count"; exit 1; }
          for f in *; do
            case "$f" in *[!0-9a-f]*) echo "::error::not a digest filename: $f"; exit 1 ;; esac
            [ ${#f} -eq 64 ] || { echo "::error::bad digest length: $f"; exit 1; }
          done
          set +e
          out=$(docker buildx imagetools create $tags $sources 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::imagetools create exit $code | tags=[$tags] | sources=[$sources] | $msg"
            exit 1
          fi

      - name: Mirror the manifest to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr --arg dh "docker.io/$DOCKERHUB_USERNAME/critique" \
            '.tags | map(sub("^ghcr\\.io/[^:]+"; $dh)) | map("-t " + .) | join(" ")' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=$(printf "ghcr.io/${{ github.repository }}@sha256:%s " *)
          echo "tags: $tags"
          docker buildx imagetools create $tags $sources

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

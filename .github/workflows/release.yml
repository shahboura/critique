# Publishes the CLI tarball as a GitHub release asset, so self-hosted consumers
# install one exact artifact instead of `npm install -g critique@latest` (that npm
# name belongs to a third party and cannot contain this fork's code):
#
#   gh release download v0.4.1 --repo <owner>/critique --pattern 'critique-*'
#   sha256sum -c critique-0.4.1.tgz.sha256
#   npm install -g ./critique-0.4.1.tgz
#
# The tarball is architecture independent (JS plus wasm), so there is no
# per-arch build: one artifact serves amd64 and arm64 hosts.
#
# Release steps: bump cli/package.json, commit, `git tag v<version>`,
# `git push --follow-tags`. The tag must match cli/package.json, because two
# releases sharing a version produce identical asset names and silently
# overwrite each other.

name: release

on:
  push:
    tags: ["v*", "critique@*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild assets for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tarball:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Check the tag matches cli/package.json and is not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./cli/package.json').version")
          tag_version=${TAG#critique@}
          tag_version=${tag_version#v}
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag $TAG does not match cli/package.json version $version"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          # A published version maps to exactly one commit. Rebuilding it would
          # mint different bytes under the same version, so this fails instead.
          existing=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null) || existing=""
          if printf '%s' "$existing" | grep -q "critique-$version.tgz"; then
            echo "::error::$TAG is already published; cut a new version instead of rebuilding it"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Stamp the build id
        run: |
          printf 'export const BUILD_ID: string = "%s"\n' "$COMMIT" > cli/src/build-info.ts

      - name: Build and pack
        run: |
          # worker.tsx imports @critique.work/server types, and
          # cli/src/agentation-widget.tsx imports @critique.work/agentation.
          # Both are workspace packages whose dist is gitignored, so a clean
          # checkout has no types to resolve until they are built.
          bun run build:comments-server
          bun run build:agentation
          cd cli
          bun run build
          bun pm pack --destination "$RUNNER_TEMP"

      - name: Check the tarball is complete
        run: |
          tgz="$RUNNER_TEMP/critique-$VERSION.tgz"
          test -f "$tgz"
          # dist is the entrypoint; src/themes and public are read from disk at
          # runtime, so a dist-only tarball breaks themes and the diff font.
          # public/third-party-licenses.txt is the license the widget banner points at.
          for f in package/dist/cli.js package/dist/build-info.js package/src/themes/github.json package/public/jetbrains-mono-nerd.woff2 package/public/third-party-licenses.txt; do
            tar -tzf "$tgz" | grep -qx "$f" || { echo "::error::$f missing from the tarball"; exit 1; }
          done

      - name: Smoke install
        run: |
          # npm 11 blocks install scripts by default; the CLI works without the
          # native tree-sitter builds (wasm grammars), so keep them blocked as
          # the self-hosted image does.
          npm install -g --ignore-scripts --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/critique-$VERSION.tgz"
          "$RUNNER_TEMP/prefix/bin/critique" --help > /dev/null

      - name: Checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "critique-$VERSION.tgz" > "critique-$VERSION.tgz.sha256"
          cat "critique-$VERSION.tgz.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          die() { echo "::error::$1"; exit 1; }

          release_json=$(curl -fsS "${auth[@]}" "$api/releases/tags/$TAG" 2>/dev/null) || release_json=""
          if [ -n "$release_json" ]; then
            # Only complete a release this same commit created; never replace a
            # published asset. That is what keeps version -> commit immutable.
            if ! printf '%s' "$release_json" | grep -q "$COMMIT"; then
              die "$TAG was released from a different commit; cut a new version"
            fi
            if printf '%s' "$release_json" | grep -q "critique-$VERSION.tgz"; then
              die "$TAG is already published; cut a new version"
            fi
            release_id=$(printf '%s' "$release_json" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          else
            release_json=$(curl -fsS "${auth[@]}" -X POST "$api/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Built from commit $COMMIT. This version is immutable: publish a new version instead of rebuilding it.\",\"generate_release_notes\":true}") \
              || die "cannot create the release for $TAG"
            release_id=$(printf '%s' "$release_json" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          fi

          for file in "critique-$VERSION.tgz" "critique-$VERSION.tgz.sha256"; do
            curl -fsS "${auth[@]}" -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$file" \
              > /dev/null || die "cannot upload $file"
          done
          echo "published critique-$VERSION.tgz from $COMMIT"
